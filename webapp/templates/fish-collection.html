<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Fish Collection Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    {% include 'navbar.html' %}
    <h1>Fish Collection Page</h1>
    
    <div class="fish-container">
        {% for fish in fish_list %}
        <div class="fish-card" id="fish-{{ fish[0] }}">
            <h2>{{ fish[1] }}</h2>
            <img
                src="{{ fish[2] }}"
                alt="Image of {{ fish[1] }} not available"
                width="200"
            >

            <p>Size: {{ fish[3] }}</p>
            <p>{{ fish[4] }}</p>

        </div>
        {% endfor %}
    </div>

</body>
</html>
