<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    {% include 'navbar.html' %}
    <h1>Create Account</h1>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    
    <form method='POST' action='{{ url_for("create_account") }}'>
        <label>
            Username:
        </label>
        <input 
            type='text'
            name='username'
        >
    
        <label>
            Password:
        </label>
        <input 
            type='password'
            name='password'
        >
    
        <button type='submit'>
            Create Account
        </button>
    </form>


</body>
</html>
